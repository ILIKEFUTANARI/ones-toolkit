query FetchUserManhoursInfo {
  buckets(
    groupBy: $groupBy
    orderBy: $orderBy
  ) {
    manhours(filter: $manhourFilter) {
      key
    }
    owner {
      uuid
      name
    }
    actualHours(sum: "manhours.recordedHour")
    estimatedHours(sum: "manhours.estimatedHour")
    remainingHour
  }
}
