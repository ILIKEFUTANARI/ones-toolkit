[package]
name = "ones-toolkit"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "Unofficial third-party HTTP, MCP, and CLI toolkit for ONES issue management"
license = "MIT"
readme = "README.md"
repository = "https://github/cloudiful/ones-mcp"
homepage = "https://github/cloudiful/ones-mcp"
documentation = "https://github/cloudiful/ones-mcp/src/branch/main/README.md"
keywords = ["ones", "mcp", "cli", "http", "integration"]

[lib]
name = "ones"
path = "src/lib.rs"

[[bin]]
name = "ones"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["http", "mcp", "cli"]
http = ["dep:axum", "dep:utoipa", "dep:utoipa-axum", "tokio/net", "tokio/rt-multi-thread", "tokio/signal"]
mcp = ["dep:rmcp", "dep:schemars", "rmcp/server", "rmcp/macros", "rmcp/schemars", "rmcp/transport-io"]
mcp-http = ["mcp", "rmcp/transport-streamable-http-server", "rmcp/transport-streamable-http-server-session"]
cli = ["dep:clap", "dep:tracing-subscriber", "http", "mcp-http"]

[dependencies]
axum = { version = "0.8.9", optional = true }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = [ "json", "rustls" ] }
rmcp = { version = "3.5.1", optional = true }
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "fmt" ], optional = true }
utoipa = { version = "6.0.0", features = [ "axum_extras" ], optional = true }
utoipa-axum = { version = "0.3.0", optional = true }

[dev-dependencies]
axum = "0.8.9"
rmcp = { version = "3.5.1", features = ["client", "server", "macros", "schemars", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
