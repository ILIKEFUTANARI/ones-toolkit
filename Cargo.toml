[package]
name = "ones-toolkit"
version = "0.2.4"
edition = "2024"
description = "Unofficial third-party HTTP, MCP, and CLI toolkit for ONES issue management"
license = "MIT"
readme = "README.md"
repository = "https://github/cloudiful/ones-mcp"
homepage = "https://github/cloudiful/ones-mcp"
documentation = "https://github/cloudiful/ones-mcp/src/branch/main/README.md"
keywords = ["ones", "mcp", "cli", "http", "integration"]

[lib]
name = "ones"
path = "src/lib.rs"

[[bin]]
name = "ones"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
http = "1.4.2"
reqwest = { version = "0.13.4", default-features = false, features = [ "json", "rustls" ] }
rmcp = { version = "2.2.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "fmt" ] }
utoipa = { version = "5.4.0", features = [ "axum_extras" ] }
utoipa-axum = "0.2.0"

[dev-dependencies]
rmcp = { version = "2.2.0", features = ["client", "server", "macros", "schemars", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
